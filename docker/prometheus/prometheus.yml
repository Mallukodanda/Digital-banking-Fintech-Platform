global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'fintech-core-banking'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['backend:8080', 'host.docker.internal:8080']
        labels:
          application: 'digital-banking-platform'
          environment: 'hybrid-or-docker'
