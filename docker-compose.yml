services:
  # ============================================================================
  # 1. PostgreSQL 16 (Authoritative ACID Ledger Store)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: fintech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fintech_banking}
      POSTGRES_USER: ${DB_USER:-banking_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-banking_secure_pass_2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - banking-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-banking_admin} -d ${DB_NAME:-fintech_banking}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # 2. Redis 7 (Distributed Cache & Idempotency Store)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: fintech-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - banking-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ============================================================================
  # 3. Apache Kafka (KRaft Mode Event Streaming Broker)
  # ============================================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: fintech-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    networks:
      - banking-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ============================================================================
  # 4. Spring Boot 3.2.4 Backend Core Engine
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintech-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-fintech_banking}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-banking_admin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-banking_secure_pass_2026}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      APP_JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      APP_JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - banking-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ============================================================================
  # 5. React SPA & Nginx Edge Reverse Proxy
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fintech-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3002}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - banking-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/healthz || exit 1" ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ============================================================================
  # 6. Prometheus Time-Series Metrics Scraper
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: fintech-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9095}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - banking-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ============================================================================
  # 7. Grafana Observability Dashboards
  # ============================================================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: fintech-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin_observability_2026
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - banking-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ============================================================================
  # 8. pgAdmin 4 (PostgreSQL Web Client)
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fintech-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bank.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - banking-network
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================================================
  # 9. RedisInsight (Redis Web Client)
  # ============================================================================
  redis-insight:
    image: redis/redisinsight:latest
    container_name: fintech-redis-insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    networks:
      - banking-network
    depends_on:
      redis:
        condition: service_healthy

  # ============================================================================
  # 10. Kafka UI (Apache Kafka Web Client)
  # ============================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fintech-kafka-ui
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fintech-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - banking-network
    depends_on:
      kafka:
        condition: service_healthy

# ==============================================================================
# Persistent Named Storage Volumes
# ==============================================================================
volumes:
  postgres_data:
    name: fintech_postgres_data
  redis_data:
    name: fintech_redis_data
  kafka_data:
    name: fintech_kafka_data
  prometheus_data:
    name: fintech_prometheus_data
  grafana_data:
    name: fintech_grafana_data

# ==============================================================================
# Isolated Bridge Network
# ==============================================================================
networks:
  banking-network:
    name: fintech_banking_network
    driver: bridge
